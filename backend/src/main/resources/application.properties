spring.application.name=backend

server.port=${PORT:8080}

# Configuración de conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:sigac_db}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


## Configuración de JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000
security.jwt.algorithm=HS256

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


# CORS - orígenes adicionales permitidos (separados por coma), ej: dominio del frontend en Railway
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sigac.acusab.ed.cr}

# Almacenamiento de documentos de estudiantes (ej: montar un Volume de Railway y apuntar aquí)
sigac.storage.documents=${SIGAC_STORAGE_DOCUMENTS:./storage/documents}

# Tamaño máximo de archivos subidos (Spring acepta solo 1 MB por defecto).
# Debe ser coherente con client_max_body_size de nginx/default.conf.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Correo transaccional con la API HTTP de Brevo (Railway bloquea SMTP en Free/Trial/Hobby).
# Si BREVO_API_KEY está vacía, no se envían correos y el código se muestra en la consola.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@acusab.ed.cr}
brevo.sender-name=${BREVO_SENDER_NAME:SIGAC ACUSAB}
# Logo de los correos: el mismo favicon del frontend, con URL pública
sigac.logo-url=${SIGAC_LOGO_URL:https://sigac.acusab.ed.cr/favicon.png}
# Dirección del frontend para los enlaces "Ingresar a SIGAC" de los correos
sigac.frontend-url=${SIGAC_FRONTEND_URL:https://sigac.acusab.ed.cr}
