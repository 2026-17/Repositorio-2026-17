spring.application.name=backend

server.port=${PORT:8080}

# Configuración de conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:sigac}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


## Configuración de JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000
security.jwt.algorithm=HS256

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


# CORS - orígenes adicionales permitidos (separados por coma), ej: dominio del frontend en Railway
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sigac.acusab.ed.cr}

# Carga de documentos del expediente estudiantil (HU-022)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.documentos-estudiantes=${DOCUMENTOS_STORAGE_PATH:storage/documentos-estudiantes}
