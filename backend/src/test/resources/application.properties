spring.application.name=backend-test

# Puerto aleatorio durante las pruebas
server.port=0

# Base de datos H2 en memoria, únicamente para pruebas
spring.datasource.url=jdbc:h2:mem:sigac_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate para pruebas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT exclusivo para pruebas
security.jwt.secret-key=0123456789abcdef0123456789abcdef
security.jwt.expiration-time=3600000
security.jwt.algorithm=HS256

# CORS de pruebas
cors.allowed-origins=http://localhost:5173

# Almacenamiento de documentos del expediente estudiantil, para pruebas
app.storage.documentos-estudiantes=${java.io.tmpdir}/sigac-test-storage