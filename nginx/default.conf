# Este archivo se carga dentro del bloque http de Nginx.
include /etc/nginx/resolvers.conf;

upstream sigac_backend {
    zone sigac_backend 64k;

    # Reemplazar dominio y puerto por los reales.
    server backend.railway.internal:8080 resolve;
}

upstream sigac_frontend {
    zone sigac_frontend 64k;

    # Reemplazar dominio y puerto por los reales.
    server frontend.railway.internal:8080 resolve;
}

# Conserva el protocolo público informado por Railway.
map $http_x_forwarded_proto $original_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;

    # Tamaño máximo del cuerpo completo de una solicitud.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $original_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Comprueba únicamente que Nginx está funcionando.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # API: elimina /api/ antes de enviar al backend.
    location /api/ {
        proxy_pass http://sigac_backend;
    }

    #Everything else goes to frontend
    location / {
        proxy_pass http://sigac_frontend;
    }
}

