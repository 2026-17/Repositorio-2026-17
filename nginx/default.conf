# Este archivo se carga dentro del bloque http de Nginx.
include /etc/nginx/resolvers.conf;

upstream sigac_backend {
    zone sigac_backend 64k;

    # Reemplazar dominio y puerto por los reales.
    server backend.railway.internal:8080 resolve;
}

upstream sigac_frontend {
    zone sigac_frontend 64k;

    # Reemplazar dominio y puerto por los reales.
    server frontend.railway.internal:8080 resolve;
}

# Conserva el protocolo público informado por Railway.
map $http_x_forwarded_proto $original_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;

    # Tamaño máximo del cuerpo completo de una solicitud.
    client_max_body_size 55m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $original_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Comprueba únicamente que Nginx está funcionando.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # API: elimina /api/ antes de enviar al backend.
    location /api/ {
        proxy_pass http://sigac_backend/;
    }

    # Archivos del build de Vite: el nombre lleva un hash que cambia en cada
    # despliegue (index-Bj95b_8x.js), así que se pueden guardar un año.
    location /assets/ {
        proxy_pass http://sigac_frontend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else goes to frontend.
    # index.html (y las rutas de la SPA) se revalidan SIEMPRE: sin esto el
    # navegador podía seguir usando el index.html viejo, que apunta al JS
    # viejo, contra un backend ya actualizado (con ETag, si no cambió el
    # servidor responde 304 sin volver a enviar el archivo).
    location / {
        proxy_pass http://sigac_frontend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}

